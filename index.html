  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: #1a1d20; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
    body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom); }
    .logo { width: 84px; height: 84px; border-radius: 19px; background: #1a1d20; display: flex; align-items: center; justify-content: center; font-size: 60px; font-weight: 800; letter-spacing: -2px; box-shadow: 0 0 0 1px rgba(255,255,255,0.08); }

    .spinner { width: 24px; height: 24px; border: 2px solid rgba(255,255,255,0.15); border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; }

    .fallback { position: fixed; bottom: calc(24px + env(safe-area-inset-bottom)); left: 24px; right: 24px; text-align: center; font-size: 11px; opacity: 0.4; line-height: 1.6; }
