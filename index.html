<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FINANZAS">
  <meta name="theme-color" content="#1a1d20">
  <title>FINANZAS</title>
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/svg+xml" href='data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="22" fill="%231a1d20"/><text x="50" y="72" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-weight="800" font-size="68" fill="white" letter-spacing="-2">F</text></svg>'>
  <style>
    html, body { margin: 0; height: 100%; background: #1a1d20; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
    #app { position: fixed; top: env(safe-area-inset-top, 0px); left: 0; width: 100%; height: calc(100vh - env(safe-area-inset-top, 0px)); height: calc(100dvh - env(safe-area-inset-top, 0px)); border: 0; background: #f8f9fa; display: none; }
    .pantalla { position: fixed; inset: 0; padding-top: env(safe-area-inset-top, 0px); background: #f8f9fa; display: none; align-items: center; justify-content: center; }
    .caja { width: 100%; max-width: 300px; margin: 16px; background: #fff; border: 1px solid #e9ecef; border-radius: 14px; padding: 24px; box-shadow: 0 6px 18px rgba(0,0,0,0.06); text-align: center; }
    .logo { width: 44px; height: 44px; border-radius: 11px; background: #1a1d20; color: #fff; font-weight: 800; font-size: 28px; line-height: 44px; margin: 0 auto 14px; }
    h1 { font-size: 12px; font-weight: 800; letter-spacing: 1.4px; text-transform: uppercase; color: #1a1d20; margin: 0 0 16px; }
    input { width: 100%; box-sizing: border-box; padding: 12px; font-size: 22px; letter-spacing: 6px; text-align: center; border: 1px solid #ced4da; border-radius: 8px; outline: none; }
    input:focus { border-color: #1a1d20; }
    button { width: 100%; margin-top: 12px; padding: 12px; border: none; border-radius: 8px; background: #1a1d20; color: #fff; font-size: 11px; font-weight: 800; letter-spacing: 0.8px; text-transform: uppercase; cursor: pointer; }
    .msg { min-height: 16px; margin-top: 10px; font-size: 12px; color: #dc3545; line-height: 1.4; }
    .spinner { width: 28px; height: 28px; border: 2.5px solid #e9ecef; border-top-color: #1a1d20; border-radius: 50%; animation: girar .8s linear infinite; }
    @keyframes girar { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="pantalla" id="pantalla-pin">
    <form class="caja" id="form-pin" autocomplete="off">
      <div class="logo">F</div>
      <h1>Ingresá tu PIN</h1>
      <input type="password" id="pin" inputmode="numeric" pattern="[0-9]*" maxlength="12" autocomplete="off">
      <button type="submit">Entrar</button>
      <div class="msg" id="pin-msg"></div>
    </form>
  </div>

  <div class="pantalla" id="pantalla-carga"><div class="spinner"></div></div>

  <iframe id="app" title="FINANZAS"></iframe>

  <script>
    (function () {
      // ↓↓↓ Pegá acá la URL de tu implementación de Apps Script (termina en /exec)
      var APP_URL = "https://script.google.com/macros/s/AKfycbys1Sh9eTkesR5mhdOappQEYR4AkNeH3UIPWOCXAaQ2fm_Jg_NLqML8PGLkjRqT8QA/exec";
      // ↑↑↑

      var CLAVE = "finanzas_pin";
      var app = document.getElementById("app");
      var pPin = document.getElementById("pantalla-pin");
      var pCarga = document.getElementById("pantalla-carga");
      var input = document.getElementById("pin");
      var msg = document.getElementById("pin-msg");

      function leer() { try { return localStorage.getItem(CLAVE) || ""; } catch (e) { return ""; } }
      function guardar(p) { try { localStorage.setItem(CLAVE, p); } catch (e) {} }
      function borrar() { try { localStorage.removeItem(CLAVE); } catch (e) {} }

      function abrir(pin) {
        pPin.style.display = "none";
        pCarga.style.display = "flex";
        app.style.display = "block";
        app.src = APP_URL + (APP_URL.indexOf("?") >= 0 ? "&" : "?") + "k=" + encodeURIComponent(pin);
      }

      function pedirPin(texto) {
        app.style.display = "none";
        app.src = "about:blank";
        pCarga.style.display = "none";
        pPin.style.display = "flex";
        msg.textContent = texto || "";
        input.value = "";
        setTimeout(function () { input.focus(); }, 150);
      }

      document.getElementById("form-pin").addEventListener("submit", function (e) {
        e.preventDefault();
        var p = input.value.trim();
        if (!/^\d{6,12}$/.test(p)) { msg.textContent = "El PIN tiene entre 6 y 12 números."; return; }
        guardar(p);
        abrir(p);
      });

      app.addEventListener("load", function () {
        if (app.src && app.src !== "about:blank") pCarga.style.display = "none";
      });

      // La app (o la pantalla de bloqueo) avisa por postMessage si el PIN no sirve.
      window.addEventListener("message", function (e) {
        var d = e.data || {};
        if (!d.finanzas) return;
        if (d.finanzas === "PIN_INVALIDO") { borrar(); pedirPin("PIN incorrecto. Probá de nuevo."); }
        else if (d.finanzas === "SIN_CLAVE") { pedirPin("La app no recibió el PIN (código SIN_CLAVE). Volvé a ingresarlo; si se repite, avisá."); }
        else if (d.finanzas === "BLOQUEADO") { borrar(); pedirPin("Demasiados intentos. Esperá 15 minutos."); }
        else if (d.finanzas === "SIN_PIN") { pedirPin("Todavía no configuraste el PIN en la planilla (menú FINANZAS)."); }
      });

      var guardado = leer();
      if (guardado) abrir(guardado); else pedirPin("");
    })();
  </script>
</body>
</html>
