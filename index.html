<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>FINANZAS</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- PWA / iOS standalone -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FINANZAS">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#1a1d20">

  <!-- Íconos SVG embebidos -->
  <link rel="icon" type="image/svg+xml" href='data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="22" fill="%231a1d20"/><text x="50" y="72" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-weight="800" font-size="68" fill="white" letter-spacing="-2">F</text></svg>'>
  <link rel="apple-touch-icon" href='data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180"><rect width="180" height="180" rx="40" fill="%231a1d20"/><text x="90" y="129" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-weight="800" font-size="122" fill="white" letter-spacing="-3">F</text></svg>'>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #1a1d20; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    /* Bloque negro para tapar el área de la barra de estado del iPhone */
    .status-bar-cover {
      position: fixed; top: 0; left: 0; right: 0;
      height: env(safe-area-inset-top, 0px);
      background: #1a1d20;
      z-index: 10;
    }

    /* Splash que se muestra mientras carga */
    .splash {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 28px; background: #1a1d20; color: #fff;
      z-index: 5;
      transition: opacity .4s ease;
    }
    .splash.oculto { opacity: 0; pointer-events: none; }
    .splash .logo {
      width: 84px; height: 84px; border-radius: 19px;
      background: #1a1d20;
      display: flex; align-items: center; justify-content: center;
      font-size: 60px; font-weight: 800; letter-spacing: -2px;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.08);
    }
    .splash .title { font-size: 12px; font-weight: 800; letter-spacing: 3px; opacity: 0.5; text-transform: uppercase; }
    .splash .spinner {
      width: 24px; height: 24px;
      border: 2px solid rgba(255,255,255,0.15);
      border-top-color: #fff; border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* El iframe que contiene la app */
    iframe {
      position: fixed;
      top: env(safe-area-inset-top, 0px);
      left: 0; right: 0; bottom: 0;
      width: 100%;
      height: calc(100% - env(safe-area-inset-top, 0px));
      border: 0;
      background: #f8f9fa;
      z-index: 1;
    }
  </style>
</head>
<body>
  <div class="status-bar-cover"></div>

  <div class="splash" id="splash">
    <div class="logo">F</div>
    <div class="title">Finanzas</div>
    <div class="spinner"></div>
  </div>

  <iframe
    id="appFrame"
    src=""
    allow="clipboard-read; clipboard-write"
    sandbox="allow-scripts allow-forms allow-same-origin allow-popups allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation"
    onload="appCargada()">
  </iframe>

  <script>
    // ⚠️ PEGÁ ACÁ TU URL DE APPS SCRIPT (la del Deploy, termina en /exec)
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbys1Sh9eTkesR5mhdOappQEYR4AkNeH3UIPWOCXAaQ2fm_Jg_NLqML8PGLkjRqT8QA/exec";

    // Cargar el iframe (en vez de redirigir la página entera)
    document.getElementById('appFrame').src = APPS_SCRIPT_URL;

    function appCargada() {
      // Damos un pequeño respiro extra para que la app termine de renderizar
      setTimeout(() => {
        document.getElementById('splash').classList.add('oculto');
      }, 800);
    }

    // Si la app tarda demasiado igualmente ocultamos el splash a los 8 segundos
    setTimeout(() => {
      document.getElementById('splash').classList.add('oculto');
    }, 8000);
  </script>
</body>
</html>
